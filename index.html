<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mochi Booth — Cute Photobooth</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#F4A0B5;--pink-light:#FFD6E0;--pink-dark:#D9788F;
  --lavender:#C3B1E1;--lavender-light:#EDE4FF;
  --peach:#FFCBA4;--peach-light:#FFE8D6;
  --mint:#B8E0D2;--mint-light:#DFF5ED;
  --bg:#FFF9FA;--bg2:#FFF0F3;--card:rgba(255,255,255,0.75);
  --text:#5C3D4A;--text-light:#9B7A88;--text-muted:#C4A8B4;
  --border:rgba(244,160,181,0.25);--shadow:0 8px 32px rgba(244,160,181,0.15);
  --glass:rgba(255,255,255,0.55);--glass-border:rgba(255,255,255,0.4);
  --radius:20px;--radius-sm:12px;--radius-xs:8px;
  --font-display:'Pacifico',cursive;--font-ui:'Quicksand',sans-serif;
}
[data-theme="dark"]{
  --pink:#E8899E;--pink-light:#3D2530;--pink-dark:#C46A7F;
  --lavender:#9B86BF;--lavender-light:#251E35;
  --peach:#D4A070;--peach-light:#352A1E;
  --mint:#7EBFA8;--mint-light:#1E302A;
  --bg:#1A1220;--bg2:#241A2C;--card:rgba(40,28,52,0.75);
  --text:#F0E4EE;--text-light:#B8A0B4;--text-muted:#7A6070;
  --border:rgba(232,137,158,0.2);--shadow:0 8px 32px rgba(0,0,0,0.3);
  --glass:rgba(40,28,52,0.6);--glass-border:rgba(100,70,100,0.3);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text);transition:background .5s,color .5s}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--pink-light);border-radius:4px}

/* ===== UTILITAS ===== */
.hidden{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border:none;border-radius:var(--radius-sm);font-family:var(--font-ui);font-weight:600;font-size:14px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--lavender));color:#fff;box-shadow:0 4px 20px rgba(244,160,181,0.4)}
.btn-primary:hover{box-shadow:0 6px 28px rgba(244,160,181,0.55);transform:translateY(-1px)}
.btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg2)}
.btn-sm{padding:8px 16px;font-size:12px;border-radius:var(--radius-xs)}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%}
.btn-ghost{background:transparent;color:var(--text-light)}
.btn-ghost:hover{background:var(--bg2);color:var(--text)}

/* ===== LAYAR INTRO ===== */
#intro-screen{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#FFF0F3 0%,#EDE4FF 40%,#FFE8D6 70%,#DFF5ED 100%);transition:opacity .8s,transform .8s}
[data-theme="dark"] #intro-screen{background:linear-gradient(135deg,#1A1220 0%,#201830 40%,#2A1E18 70%,#182420 100%)}
#intro-screen.fade-out{opacity:0;transform:scale(1.05);pointer-events:none}
.intro-mochi{width:100px;height:100px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#FFF0F3,#FFD6E0);box-shadow:0 8px 30px rgba(244,160,181,0.3);position:relative;animation:mochiBounce 2s ease-in-out infinite;margin-bottom:24px}
.intro-mochi .eye{position:absolute;width:8px;height:10px;background:var(--text);border-radius:50%;top:38px}
.intro-mochi .eye.l{left:30px}.intro-mochi .eye.r{right:30px}
.intro-mochi .blush{position:absolute;width:16px;height:10px;background:rgba(244,160,181,0.4);border-radius:50%;top:48px}
.intro-mochi .blush.l{left:18px}.intro-mochi .blush.r{right:18px}
.intro-mochi .mouth{position:absolute;width:10px;height:6px;border-bottom:2px solid var(--text);border-radius:0 0 50% 50%;top:52px;left:50%;transform:translateX(-50%)}
@keyframes mochiBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.intro-title{font-family:var(--font-display);font-size:clamp(36px,8vw,56px);background:linear-gradient(135deg,var(--pink),var(--lavender),var(--peach));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px;animation:titleIn 1s ease-out both;animation-delay:.3s}
.intro-sub{color:var(--text-light);font-size:16px;font-weight:500;margin-bottom:40px;animation:fadeUp .8s ease-out both;animation-delay:.6s}
.intro-btn{animation:fadeUp .8s ease-out both;animation-delay:.9s;padding:16px 48px;font-size:16px;border-radius:50px;box-shadow:0 6px 30px rgba(244,160,181,0.4)}
.intro-btn:hover{box-shadow:0 8px 40px rgba(244,160,181,0.6);transform:translateY(-2px) scale(1.02)}
.intro-theme{position:absolute;top:20px;right:20px;animation:fadeUp .6s ease-out both;animation-delay:1.2s}
@keyframes titleIn{from{opacity:0;transform:translateY(-20px) scale(0.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ===== FLOATING ELEMENTS ===== */
.float-container{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.float-el{position:absolute;animation:floatUp linear infinite;opacity:0}
@keyframes floatUp{0%{opacity:0;transform:translateY(100vh) rotate(0deg) scale(0.5)}10%{opacity:.7}90%{opacity:.5}100%{opacity:0;transform:translateY(-10vh) rotate(360deg) scale(1)}}

/* ===== HEADER ===== */
.app-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--glass-border);z-index:100;position:relative}
.header-logo{font-family:var(--font-display);font-size:20px;background:linear-gradient(135deg,var(--pink),var(--lavender));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-actions{display:flex;gap:8px}

/* ===== BOOTH LAYOUT ===== */
#booth-screen{display:flex;flex-direction:column;height:100vh;position:relative}
.booth-body{flex:1;display:flex;overflow:hidden;position:relative}
.camera-area{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg2);position:relative;overflow:hidden;min-height:0}
.camera-wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#camera-video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);transition:filter .4s}
.camera-vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,0.15) 100%);pointer-events:none}

/* ===== PANEL KONTROL ===== */
.controls-panel{width:320px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-left:1px solid var(--glass-border);display:flex;flex-direction:column;overflow:hidden;z-index:10}
.tab-nav{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.tab-btn{flex:1;padding:10px 4px;border:none;background:transparent;color:var(--text-muted);font-family:var(--font-ui);font-size:11px;font-weight:600;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;gap:3px;border-bottom:2px solid transparent}
.tab-btn i{font-size:16px}
.tab-btn.active{color:var(--pink);border-bottom-color:var(--pink)}
.tab-btn:hover{color:var(--pink-dark)}
.tab-content{flex:1;overflow-y:auto;padding:16px;position:relative}
.tab-pane{display:none;animation:fadeIn .3s ease}
.tab-pane.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Frame grid */
.frame-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frame-card{aspect-ratio:3/4;border-radius:var(--radius-sm);border:2px solid var(--border);cursor:pointer;transition:all .3s;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text-light);background:var(--bg)}
.frame-card:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 4px 16px rgba(244,160,181,0.2)}
.frame-card.selected{border-color:var(--pink);box-shadow:0 0 0 3px rgba(244,160,181,0.2)}
.frame-card .frame-preview{position:absolute;inset:0;pointer-events:none}
.frame-card .frame-name{position:relative;z-index:2;background:rgba(255,255,255,0.8);padding:2px 8px;border-radius:20px;font-size:10px;backdrop-filter:blur(4px)}
[data-theme="dark"] .frame-card .frame-name{background:rgba(30,20,40,0.8)}

/* Filter grid */
.filter-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.filter-card{border-radius:var(--radius-sm);border:2px solid var(--border);cursor:pointer;transition:all .3s;overflow:hidden;text-align:center;padding-bottom:6px;background:var(--bg)}
.filter-card:hover{border-color:var(--pink)}
.filter-card.selected{border-color:var(--pink);box-shadow:0 0 0 3px rgba(244,160,181,0.2)}
.filter-preview{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.filter-card span{font-size:10px;font-weight:600;color:var(--text-light)}

/* Settings */
.setting-group{margin-bottom:20px}
.setting-label{font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.setting-label i{color:var(--pink);font-size:14px}
.option-row{display:flex;gap:8px}
.option-btn{flex:1;padding:10px;border:2px solid var(--border);border-radius:var(--radius-xs);background:var(--bg);color:var(--text-light);font-family:var(--font-ui);font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;text-align:center}
.option-btn:hover{border-color:var(--pink-light)}
.option-btn.selected{border-color:var(--pink);background:linear-gradient(135deg,rgba(244,160,181,0.1),rgba(195,177,225,0.1));color:var(--pink-dark)}

/* Sticker panel */
.sticker-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sticker-item{aspect-ratio:1;border-radius:var(--radius-xs);border:2px solid var(--border);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:28px;transition:all .3s}
.sticker-item:hover{border-color:var(--pink);transform:scale(1.1)}
.sticker-item:active{transform:scale(0.95)}

/* Capture bar */
.capture-bar{padding:16px;border-top:1px solid var(--border);flex-shrink:0;background:var(--glass)}
.progress-dots{display:flex;justify-content:center;gap:8px;margin-bottom:12px}
.progress-dot{width:10px;height:10px;border-radius:50%;background:var(--border);transition:all .4s}
.progress-dot.done{background:var(--pink);transform:scale(1.1)}
.progress-dot.current{background:var(--pink-light);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(244,160,181,0.4)}50%{box-shadow:0 0 0 6px rgba(244,160,181,0)}}
.capture-btn{width:64px;height:64px;border-radius:50%;border:4px solid var(--pink);background:linear-gradient(135deg,var(--pink),var(--pink-dark));cursor:pointer;position:relative;transition:all .3s;margin:0 auto;display:block}
.capture-btn::after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);transition:all .3s}
.capture-btn:hover{transform:scale(1.05);box-shadow:0 0 30px rgba(244,160,181,0.5)}
.capture-btn:active{transform:scale(0.95)}
.capture-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.capture-btn.recording{animation:capturePulse 1s ease-in-out infinite}
@keyframes capturePulse{0%,100%{box-shadow:0 0 0 0 rgba(244,160,181,0.4)}50%{box-shadow:0 0 0 12px rgba(244,160,181,0)}}

/* ===== OVERLAYS ===== */
#flash-overlay{position:fixed;inset:0;background:#fff;z-index:9999;pointer-events:none;opacity:0;transition:opacity .08s}
#flash-overlay.flash{opacity:1}
#countdown-overlay{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;pointer-events:none}
#countdown-overlay .count-num{font-family:var(--font-display);font-size:120px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,0.3);animation:countPop .6s ease-out both}
@keyframes countPop{0%{transform:scale(2);opacity:0}60%{transform:scale(0.9);opacity:1}100%{transform:scale(1);opacity:1}}
#loading-overlay{position:fixed;inset:0;z-index:9997;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--glass);backdrop-filter:blur(20px)}
.loader-spinner{width:48px;height:48px;border:3px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-weight:600;color:var(--text-light);font-size:14px}

/* ===== PREVIEW SCREEN ===== */
#preview-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:20px}
.preview-header{width:100%;max-width:500px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-shrink:0}
.preview-strip-wrap{position:relative;flex-shrink:0}
#preview-canvas{border-radius:var(--radius);box-shadow:var(--shadow);max-width:100%;height:auto;display:block}
.sticker-layer{position:absolute;inset:0;pointer-events:none}
.placed-sticker{position:absolute;pointer-events:all;cursor:grab;font-size:36px;user-select:none;touch-action:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.2));transition:transform .1s}
.placed-sticker:active{cursor:grabbing;transform:scale(1.1)}
.placed-sticker .del-btn{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:var(--pink-dark);color:#fff;font-size:10px;border:none;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1}
.placed-sticker:hover .del-btn{display:flex}
.preview-actions{display:flex;gap:12px;margin-top:20px;flex-shrink:0;flex-wrap:wrap;justify-content:center}

/* ===== GALLERY SCREEN ===== */
#gallery-screen{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.gallery-header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
.gallery-header h2{font-family:var(--font-display);font-size:24px;color:var(--pink-dark)}
.gallery-grid{flex:1;overflow-y:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-content:start}
.gallery-item{border-radius:var(--radius-sm);overflow:hidden;border:2px solid var(--border);cursor:pointer;transition:all .3s;position:relative;aspect-ratio:3/4}
.gallery-item:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 4px 16px rgba(244,160,181,0.2)}
.gallery-item img{width:100%;height:100%;object-fit:cover}
.gallery-item .gallery-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,0.5);color:#fff;border:none;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s}
.gallery-item:hover .gallery-del{opacity:1}
.gallery-empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted)}
.gallery-empty i{font-size:48px;margin-bottom:12px;display:block;color:var(--border)}

/* ===== KONFETI ===== */
#confetti-canvas{position:fixed;inset:0;z-index:9999;pointer-events:none}

/* ===== TOAST ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);padding:12px 24px;border-radius:50px;font-size:13px;font-weight:600;z-index:10000;opacity:0;transition:all .4s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast-success{background:var(--mint);color:#2D6A4F;box-shadow:0 4px 16px rgba(184,224,210,0.4)}
.toast-error{background:var(--pink-light);color:var(--pink-dark);box-shadow:0 4px 16px rgba(244,160,181,0.4)}

/* ===== ERROR KAMERA ===== */
.camera-error{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;gap:16px;height:100%}
.camera-error i{font-size:48px;color:var(--pink-light)}
.camera-error h3{font-size:18px;color:var(--text)}
.camera-error p{font-size:13px;color:var(--text-light);max-width:280px}

/* ===== WATERMARK ===== */
.watermark{text-align:center;padding:12px;font-size:10px;color:var(--text-muted);font-weight:600;letter-spacing:1px;flex-shrink:0}

/* ===== RESPONSIF ===== */
@media(max-width:768px){
  .controls-panel{width:100%;position:fixed;bottom:0;left:0;right:0;height:auto;max-height:55vh;border-left:none;border-top:1px solid var(--border);border-radius:var(--radius) var(--radius) 0 0;z-index:200;transition:transform .4s}
  .controls-panel.collapsed{transform:translateY(calc(100% - 50px))}
  .panel-handle{display:flex!important;align-items:center;justify-content:center;padding:8px;cursor:pointer}
  .panel-handle i{color:var(--text-muted);transition:transform .3s}
  .controls-panel.collapsed .panel-handle i{transform:rotate(180deg)}
  .booth-body{flex-direction:column}
  .camera-area{flex:1;min-height:0}
  .tab-content{max-height:30vh}
  .frame-grid{grid-template-columns:repeat(3,1fr)}
  .filter-grid{grid-template-columns:repeat(3,1fr)}
  .sticker-grid{grid-template-columns:repeat(6,1fr)}
  .capture-bar{padding:10px 16px}
  .capture-btn{width:56px;height:56px}
  .progress-dots{margin-bottom:8px}
  #preview-screen{padding:12px}
  .preview-strip-wrap{max-width:90vw}
  .gallery-grid{grid-template-columns:repeat(2,1fr)}
}
@media(min-width:769px){
  .panel-handle{display:none!important}
}

/* ===== ANIMASI SPARKLE ===== */
.sparkle{position:absolute;width:4px;height:4px;background:var(--pink);border-radius:50%;pointer-events:none;animation:sparkle 1.5s ease-in-out forwards}
@keyframes sparkle{0%{opacity:0;transform:scale(0)}50%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(0) rotate(180deg)}}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;z-index:8000;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;animation:fadeIn .3s}
.modal-box{background:var(--bg);border-radius:var(--radius);padding:24px;max-width:400px;width:90%;box-shadow:var(--shadow);text-align:center}
.modal-box h3{margin-bottom:8px;font-size:18px}
.modal-box p{color:var(--text-light);font-size:14px;margin-bottom:20px}
.modal-actions{display:flex;gap:10px;justify-content:center}

/* Reduced motion */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
}
</style>
</head>
<body>

<!-- ===== LAYAR INTRO ===== -->
<div id="intro-screen">
  <div class="float-container" id="intro-floats"></div>
  <div class="intro-mochi" aria-hidden="true">
    <div class="eye l"></div><div class="eye r"></div>
    <div class="blush l"></div><div class="blush r"></div>
    <div class="mouth"></div>
  </div>
  <h1 class="intro-title">Mochi Booth</h1>
  <p class="intro-sub">Your Cute Digital Photobooth</p>
  <button class="btn btn-primary intro-btn" id="start-btn" aria-label="Mulai photobooth">
    <i class="fa-solid fa-camera"></i> Start Photobooth
  </button>
  <button class="btn btn-icon btn-ghost intro-theme" id="intro-theme-btn" aria-label="Ganti tema">
    <i class="fa-solid fa-moon"></i>
  </button>
</div>

<!-- ===== LAYAR BOOTH ===== -->
<div id="booth-screen" class="hidden">
  <header class="app-header">
    <span class="header-logo">Mochi Booth</span>
    <div class="header-actions">
      <button class="btn btn-icon btn-ghost" id="gallery-btn" aria-label="Galeri"><i class="fa-solid fa-images"></i></button>
      <button class="btn btn-icon btn-ghost" id="theme-btn" aria-label="Ganti tema"><i class="fa-solid fa-moon"></i></button>
    </div>
  </header>
  <div class="booth-body">
    <div class="camera-area">
      <div class="camera-wrap">
        <video id="camera-video" autoplay playsinline muted></video>
        <div class="camera-vignette"></div>
        <div id="camera-error" class="camera-error hidden">
          <i class="fa-solid fa-camera-rotate"></i>
          <h3>Kamera Tidak Tersedia</h3>
          <p>Pastikan kamera diaktifkan dan izin akses telah diberikan.</p>
          <button class="btn btn-primary btn-sm" onclick="initCamera()"><i class="fa-solid fa-rotate"></i> Coba Lagi</button>
        </div>
      </div>
    </div>
    <aside class="controls-panel" id="controls-panel">
      <div class="panel-handle" id="panel-handle"><i class="fa-solid fa-chevron-down"></i></div>
      <nav class="tab-nav" role="tablist">

<!-- ===== OVERLAYS ===== -->
<div id="flash-overlay"></div>
<div id="countdown-overlay" class="hidden"></div>

  <div class="loader-spinner"></div>
  <div class="loader-text">Membuat photostrip cantik...</div>

<script>
/* =============================================
   STATE & KONFIGURASI
============================================= */
const state = {
  screen: 'intro',
  theme: 'light',
  frame: 'ribbon',
  filter: 'none',
  stripCount: 4,
  countdown: 3,
  beauty: false,
  photos: [],
  isCapturing: false,
  gallery: [],
  stickers: []
};

/* Definisi frame */
const frameDefs = [
  { id:'ribbon', name:'Pink Ribbon', color:'#F4A0B5', bg:'#FFF0F3' },
  { id:'sakura', name:'Sakura', color:'#FFB7C5', bg:'#FFF5F7' },
  { id:'coquette', name:'Coquette', color:'#E8B4C8', bg:'#FDF0F5' },
  { id:'y2k', name:'Y2K', color:'#C3B1E1', bg:'#F3EEFF' },
  { id:'floral', name:'Floral', color:'#B8E0D2', bg:'#F0FAF6' },
  { id:'hearts', name:'Hearts', color:'#F4A0B5', bg:'#FFF0F3' },
  { id:'glitter', name:'Glitter', color:'#FFCBA4', bg:'#FFF8F0' },
  { id:'minimal', name:'Minimal', color:'#C4A8B4', bg:'#FAFAFA' },
  { id:'retro', name:'Retro', color:'#D4A574', bg:'#FFF8F0' },
  { id:'sanrio', name:'Sanrio', color:'#FF8FAB', bg:'#FFF0F5' }
];

/* Definisi filter */
const filterDefs = [
  { id:'none', name:'Normal', css:'none' },
  { id:'softglow', name:'Soft Glow', css:'brightness(1.08) contrast(0.95) saturate(1.1)' },
  { id:'vintage', name:'Vintage', css:'sepia(0.25) contrast(1.1) brightness(0.95) saturate(0.9)' },
  { id:'pinktone', name:'Pink Tone', css:'hue-rotate(-10deg) saturate(1.4) brightness(1.05)' },
  { id:'bw', name:'B&W', css:'grayscale(1) contrast(1.1)' },
  { id:'dreamy', name:'Dreamy', css:'brightness(1.1) saturate(1.3) contrast(0.9)' }
];

/* Definisi sticker */
const stickerDefs = [
  '❤️','💖','💗','🌸','✨','⭐','🦋','🎀',
  '🌺','🌷','💫','💕','🩷','🌙','☁️','🐱'
];

/* =============================================
   REFERENSI DOM
============================================= */
const $ = id => document.getElementById(id);
const video = $('camera-video');
const flash = $('flash-overlay');
const countdownOv = $('countdown-overlay');
const loadingOv = $('loading-overlay');
const previewCanvas = $('preview-canvas');
const previewCtx = previewCanvas.getContext('2d');
const confettiCanvas = $('confetti-canvas');
const confettiCtx = confettiCanvas.getContext('2d');

/* =============================================
   UTILITAS
============================================= */
function showToast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2500);
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

/* =============================================
   MANAJEMEN LAYAR
============================================= */
function showScreen(name) {
  state.screen = name;
  $('intro-screen').classList.toggle('hidden', name !== 'intro');
  $('booth-screen').classList.toggle('hidden', name !== 'booth');
  $('preview-screen').classList.toggle('hidden', name !== 'preview');
  $('gallery-screen').classList.toggle('hidden', name !== 'gallery');
}

/* =============================================
   TEMA
============================================= */
function setTheme(theme) {
  state.theme = theme;
  document.documentElement.setAttribute('data-theme', theme);
  const icon = theme === 'dark' ? 'fa-sun' : 'fa-moon';
  document.querySelectorAll('#theme-btn i, #intro-theme-btn i').forEach(i => {
    i.className = `fa-solid ${icon}`;
  });
}
function toggleTheme() {
  setTheme(state.theme === 'light' ? 'dark' : 'light');
}

/* =============================================
   KAMERA
============================================= */
let stream = null;

async function initCamera() {
  $('camera-error').classList.add('hidden');
  video.classList.remove('hidden');
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:'user', width:{ideal:1280}, height:{ideal:960} },
      audio: false
    });
    video.srcObject = stream;
    applyFilter();
  } catch(e) {
    console.error('Kamera error:', e);
    video.classList.add('hidden');
    $('camera-error').classList.remove('hidden');
  }
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

/* =============================================
   FILTER
============================================= */
function applyFilter() {
  let css = filterDefs.find(f => f.id === state.filter)?.css || 'none';
  if (state.beauty) {
    const beautyCSS = 'blur(0.4px) brightness(1.03)';
    css = css === 'none' ? beautyCSS : css + ' ' + beautyCSS;
  }
  video.style.filter = css;
}

function toggleBeauty() {
  state.beauty = !state.beauty;
  $('beauty-toggle').textContent = state.beauty ? 'On' : 'Off';
  $('beauty-toggle').classList.toggle('selected', state.beauty);
  applyFilter();
}

/* =============================================
   SUARA SHUTTER
============================================= */
let audioCtx = null;
function playShutter() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const len = audioCtx.sampleRate * 0.12;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.015));
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 2000;
    const gain = audioCtx.createGain();
    gain.gain.value = 0.6;
    src.connect(hp); hp.connect(gain); gain.connect(audioCtx.destination);
    src.start();
  } catch(e) {}
}

/* =============================================
   EFEK FLASH
============================================= */
function triggerFlash() {
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 120);
}

/* =============================================
   CAPTURE FOTO
============================================= */
function captureFrame() {
  const dims = getStripDimensions(state.stripCount);
  const size = dims.photoSize;
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');

  /* Terapkan filter ke canvas */
  let css = filterDefs.find(f => f.id === state.filter)?.css || 'none';
  if (state.beauty) {
    const b = 'blur(0.4px) brightness(1.03)';
    css = css === 'none' ? b : css + ' ' + b;
  }
  if (typeof ctx.filter !== 'undefined') ctx.filter = css;

  /* Crop tengah dan mirror */
  const vw = video.videoWidth || 640;
  const vh = video.videoHeight || 480;
  const crop = Math.min(vw, vh);
  const sx = (vw - crop) / 2;
  const sy = (vh - crop) / 2;

  ctx.save();
  ctx.translate(size, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video, sx, sy, crop, crop, 0, 0, size, size);
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
  ctx.filter = 'none';

  return c.toDataURL('image/png');
}

function getStripDimensions(count) {
  let photoSize, padding = 28, gap = 6;
  if (count <= 2) photoSize = 340;
  else if (count <= 4) photoSize = 300;
  else photoSize = 240;
  const w = photoSize + padding * 2;
  const h = photoSize * count + gap * (count - 1) + padding * 2 + 24;
  return { width: w, height: h, photoSize, padding, gap };
}

/* =============================================
   PROSES CAPTURE DENGAN COUNTDOWN
============================================= */
async function startCapture() {
  if (state.isCapturing) return;
  state.isCapturing = true;
  state.photos = [];
  updateProgress();
  $('capture-btn').classList.add('recording');
  $('capture-btn').disabled = true;

  /* Collapse panel di mobile */
  if (window.innerWidth <= 768) {
    $('controls-panel').classList.add('collapsed');
  }

  for (let i = 0; i < state.stripCount; i++) {
    /* Countdown */
    for (let c = state.countdown; c > 0; c--) {
      countdownOv.classList.remove('hidden');
      countdownOv.innerHTML = `<span class="count-num" key="${c}">${c}</span>`;
      await sleep(1000);
    }
    countdownOv.classList.add('hidden');
    countdownOv.innerHTML = '';

    /* Flash + shutter + capture */
    triggerFlash();
    playShutter();
    await sleep(100);
    state.photos.push(captureFrame());
    updateProgress();
    await sleep(500);
  }

  $('capture-btn').classList.remove('recording');
  $('capture-btn').disabled = false;
  state.isCapturing = false;

  /* Buat strip */
  showLoading(true);
  await sleep(300);
  composeStrip();
  showLoading(false);
  showScreen('preview');
  loadStickers();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function showLoading(show) { loadingOv.classList.toggle('hidden', !show); }

function updateProgress() {
  const wrap = $('progress-dots');
  wrap.innerHTML = '';
  for (let i = 0; i < state.stripCount; i++) {
    const dot = document.createElement('div');
    dot.className = 'progress-dot';
    if (i < state.photos.length) dot.classList.add('done');
    else if (i === state.photos.length && state.isCapturing) dot.classList.add('current');
    wrap.appendChild(dot);
  }
}

/* =============================================
   GAMBAR FRAME PADA CANVAS
============================================= */
function drawHeart(ctx, cx, cy, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  const s = size * 0.5;
  ctx.moveTo(cx, cy + s * 0.4);
  ctx.bezierCurveTo(cx, cy - s * 0.2, cx - s, cy - s * 0.6, cx - s, cy + s * 0.1);
  ctx.bezierCurveTo(cx - s, cy + s * 0.6, cx, cy + s, cx, cy + s);
  ctx.bezierCurveTo(cx, cy + s, cx + s, cy + s * 0.6, cx + s, cy + s * 0.1);
  ctx.bezierCurveTo(cx + s, cy - s * 0.6, cx, cy - s * 0.2, cx, cy + s * 0.4);
  ctx.fill();
  ctx.restore();
}

function drawStar(ctx, cx, cy, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (i * 72 - 90) * Math.PI / 180;
    const a2 = ((i * 72) + 36 - 90) * Math.PI / 180;
    ctx.lineTo(cx + Math.cos(a) * size, cy + Math.sin(a) * size);
    ctx.lineTo(cx + Math.cos(a2) * size * 0.4, cy + Math.sin(a2) * size * 0.4);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFlower(ctx, cx, cy, size, color) {
  ctx.save();
  const petals = 5;
  for (let i = 0; i < petals; i++) {
    const a = (i * 360 / petals) * Math.PI / 180;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(cx + Math.cos(a) * size * 0.4, cy + Math.sin(a) * size * 0.4, size * 0.35, size * 0.2, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#FFE4B5';
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSakura(ctx, cx, cy, size) {
  ctx.save();
  const petals = 5;
  for (let i = 0; i < petals; i++) {
    const a = (i * 360 / petals - 90) * Math.PI / 180;
    ctx.fillStyle = i % 2 === 0 ? '#FFB7C5' : '#FFC8D6';
    ctx.beginPath();
    ctx.ellipse(cx + Math.cos(a) * size * 0.35, cy + Math.sin(a) * size * 0.35, size * 0.3, size * 0.18, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#FFE4B5';
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.12, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSparkle(ctx, cx, cy, size, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1, size * 0.12);
  ctx.lineCap = 'round';
  for (let i = 0; i < 4; i++) {
    const a = (i * 45) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(cx - Math.cos(a) * size * 0.5, cy - Math.sin(a) * size * 0.5);
    ctx.lineTo(cx + Math.cos(a) * size * 0.5, cy + Math.sin(a) * size * 0.5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBow(ctx, cx, cy, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  /* Loop kiri */
  ctx.beginPath();
  ctx.ellipse(cx - size * 0.4, cy, size * 0.45, size * 0.25, -0.3, 0, Math.PI * 2);
  ctx.fill();
  /* Loop kanan */
  ctx.beginPath();
  ctx.ellipse(cx + size * 0.4, cy, size * 0.45, size * 0.25, 0.3, 0, Math.PI * 2);
  ctx.fill();
  /* Tengah */
  ctx.fillStyle = shadeColor(color, -20);
  ctx.beginPath();
  ctx.ellipse(cx, cy, size * 0.15, size * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  /* Ekor */
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(cx - size * 0.1, cy + size * 0.1);
  ctx.lineTo(cx - size * 0.15, cy + size * 0.5);
  ctx.lineTo(cx + size * 0.05, cy + size * 0.15);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(cx + size * 0.1, cy + size * 0.1);
  ctx.lineTo(cx + size * 0.15, cy + size * 0.5);
  ctx.lineTo(cx - size * 0.05, cy + size * 0.15);
  ctx.fill();
  ctx.restore();
}

function shadeColor(hex, percent) {
  const num = parseInt(hex.replace('#',''), 16);
  const r = Math.min(255, Math.max(0, (num >> 16) + percent));
  const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + percent));
  const b = Math.min(255, Math.max(0, (num & 0x0000FF) + percent));
  return `rgb(${r},${g},${b})`;
}

function drawDottedBorder(ctx, x, y, w, h, r, color, gap) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.setLineDash([4, gap || 4]);
  roundRect(ctx, x, y, w, h, r);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

/* --- Fungsi frame utama --- */
function drawFrame(ctx, frameId, w, h, count) {
  const fn = frameDrawers[frameId];
  if (fn) fn(ctx, w, h, count);
}

const frameDrawers = {
  ribbon(ctx, w, h) {
    /* Background pink lembut */
    ctx.fillStyle = '#FFF0F3';
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    /* Border */
    ctx.strokeStyle = '#F4A0B5';
    ctx.lineWidth = 3;
    roundRect(ctx, 6, 6, w-12, h-12, 12);
    ctx.stroke();
    /* Pita di 4 sudut */
    drawBow(ctx, 24, 24, 28, '#F4A0B5');
    drawBow(ctx, w-24, 24, 28, '#F4A0B5');
    drawBow(ctx, 24, h-24, 28, '#F4A0B5');
    drawBow(ctx, w-24, h-24, 28, '#F4A0B5');
    /* Garis ribbon horizontal di antara foto */
    const dims = getStripDimensions(state.stripCount);
    for (let i = 1; i < state.stripCount; i++) {
      const y = dims.padding + i * (dims.photoSize + dims.gap) - dims.gap / 2;
      ctx.strokeStyle = '#FFD6E0';
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 6]);
      ctx.beginPath(); ctx.moveTo(20, y); ctx.lineTo(w-20, y); ctx.stroke();
      ctx.setLineDash([]);
      drawHeart(ctx, w/2, y, 8, '#FFD6E0');
    }
  },
  sakura(ctx, w, h) {
    ctx.fillStyle = '#FFF5F7';
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    ctx.strokeStyle = '#FFB7C5';
    ctx.lineWidth = 2;
    roundRect(ctx, 5, 5, w-10, h-10, 14);
    ctx.stroke();
    /* Sakura bunga di border */
    const positions = [];
    for (let i = 0; i < 12; i++) positions.push([15 + Math.random()*(w-30), 15 + Math.random()*(h-30)]);
    /* Tetap konsisten pakai seed pseudo */
    let seed = 42;
    const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    for (let i = 0; i < 16; i++) {
      const x = 18 + rand() * (w - 36);
      const y = 18 + rand() * (h - 36);
      const s = 8 + rand() * 10;
      drawSakura(ctx, x, y, s);
    }
  },
  coquette(ctx, w, h) {
    ctx.fillStyle = '#FDF0F5';
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    /* Lace border */
    ctx.strokeStyle = '#E8B4C8';
    ctx.lineWidth = 1;
    for (let i = 0; i < w; i += 12) {
      ctx.beginPath();
      ctx.arc(i, 4, 4, 0, Math.PI, true);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(i, h-4, 4, Math.PI, 0, true);
      ctx.stroke();
    }
    for (let i = 0; i < h; i += 12) {
      ctx.beginPath();
      ctx.arc(4, i, 4, -Math.PI/2, Math.PI/2, true);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(w-4, i, 4, Math.PI/2, -Math.PI/2, true);
      ctx.stroke();
    }
    /* Bows */
    drawBow(ctx, 30, 30, 22, '#E8B4C8');
    drawBow(ctx, w-30, 30, 22, '#E8B4C8');
    drawBow(ctx, 30, h-30, 22, '#E8B4C8');
    drawBow(ctx, w-30, h-30, 22, '#E8B4C8');
    /* Pearls */
    let s = 77;
    const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    ctx.fillStyle = 'rgba(232,180,200,0.3)';
    for (let i = 0; i < 20; i++) {
      ctx.beginPath();
      ctx.arc(10 + r()*(w-20), 10 + r()*(h-20), 2 + r()*2, 0, Math.PI*2);
      ctx.fill();
    }
  },
  y2k(ctx, w, h) {
    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0, '#F3EEFF');
    grad.addColorStop(0.5, '#FFE4F0');
    grad.addColorStop(1, '#F3EEFF');
    ctx.fillStyle = grad;
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    ctx.strokeStyle = '#C3B1E1';
    ctx.lineWidth = 3;
    roundRect(ctx, 6, 6, w-12, h-12, 12);
    ctx.stroke();
    /* Stars & hearts */
    let s = 123;
    const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    const colors = ['#C3B1E1','#F4A0B5','#FFCBA4','#B8E0D2'];
    for (let i = 0; i < 18; i++) {
      const x = 14 + r()*(w-28), y = 14 + r()*(h-28), sz = 5 + r()*8;
      if (i % 2 === 0) drawStar(ctx, x, y, sz, colors[i%colors.length]);
      else drawHeart(ctx, x, y, sz, colors[i%colors.length]);
    }
  },
  floral(ctx, w, h) {
    ctx.fillStyle = '#F0FAF6';
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    ctx.strokeStyle = '#B8E0D2';
    ctx.lineWidth = 2;
    roundRect(ctx, 5, 5, w-10, h-10, 14);
    ctx.stroke();
    let s = 200;
    const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    const colors = ['#FFB7C5','#FFC8D6','#FFE4B5','#B8E0D2','#C3B1E1','#FFCBA4'];
    for (let i = 0; i < 20; i++) {
      drawFlower(ctx, 14 + r()*(w-28), 14 + r()*(h-28), 6 + r()*8, colors[i%colors.length]);
    }
  },
  hearts(ctx, w, h) {
    ctx.fillStyle = '#FFF0F3';
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    ctx.strokeStyle = '#F4A0B5';
    ctx.lineWidth = 2;
    roundRect(ctx, 5, 5, w-10, h-10, 14);
    ctx.stroke();
    let s = 300;
    const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    const colors = ['#F4A0B5','#FFB7C5','#FFD6E0','#E8B4C8','#D9788F'];
    for (let i = 0; i < 22; i++) {
      drawHeart(ctx, 14 + r()*(w-28), 14 + r()*(h-28), 5 + r()*10, colors[i%colors.length]);
    }
  },
  glitter(ctx, w, h) {
    const grad = ctx.createLinearGradient(0,0,0,h);
    grad.addColorStop(0, '#FFF8F0');
    grad.addColorStop(1, '#FFF0F3');
    ctx.fillStyle = grad;
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    ctx.strokeStyle = '#FFCBA4';
    ctx.lineWidth = 2;
    roundRect(ctx, 5, 5, w-10, h-10, 14);
    ctx.stroke();
    let s = 400;
    const r = () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
    const colors = ['#FFD700','#FFCBA4','#F4A0B5','#C3B1E1','#fff'];
    for (let i = 0; i < 30; i++) {
      drawSparkle(ctx, 10 + r()*(w-20), 10 + r()*(h-20), 4 + r()*8, colors[i%colors.length]);
    }
  },
  minimal(ctx, w, h) {
    ctx.fillStyle = '#FAFAFA';
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    ctx.strokeStyle = '#C4A8B4';
    ctx.lineWidth = 1;
    roundRect(ctx, 12, 12, w-24, h-24, 8);
    ctx.stroke();
    /* Teks kecil atas */
    ctx.fillStyle = '#C4A8B4';
    ctx.font = '600 9px Quicksand, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('MOCHI BOOTH', w/2, 28);
    /* Garis tipis dekoratif */
    ctx.strokeStyle = 'rgba(196,168,180,0.3)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(w/2-30, 32); ctx.lineTo(w/2+30, 32); ctx.stroke();
    /* Titik kecil di sudut */
    [[20,20],[w-20,20],[20,h-20],[w-20,h-20]].forEach(([x,y]) => {
      ctx.fillStyle = '#C4A8B4';
      ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI*2); ctx.fill();
    });
  },
  retro(ctx, w, h) {
    ctx.fillStyle = '#FFF8F0';
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    drawDottedBorder(ctx, 6, 6, w-12, h-12, 12, '#D4A574', 3);
    drawDottedBorder(ctx, 10, 10, w-20, h-20, 10, 'rgba(212,165,116,0.4)', 5);
    /* Bunga kecil di bawah */
    drawFlower(ctx, w/2, h-22, 10, '#FFB7C5');
    drawFlower(ctx, w/2-30, h-18, 7, '#FFCBA4');
    drawFlower(ctx, w/2+30, h-18, 7, '#B8E0D2');
  },
  sanrio(ctx, w, h) {
    ctx.fillStyle = '#FFF0F5';
    roundRect(ctx, 0, 0, w, h, 16);
    ctx.fill();
    ctx.strokeStyle = '#FF8FAB';
    ctx.lineWidth = 3;
    roundRect(ctx, 5, 5, w-10, h-10, 14);
    ctx.stroke();
    /* Wajah lucu di sudut */
    const drawFace = (cx, cy, s) => {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#FF8FAB'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, s, 0, Math.PI*2); ctx.stroke();
      /* Mata */
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.ellipse(cx - s*0.3, cy - s*0.1, 2, 2.5, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + s*0.3, cy - s*0.1, 2, 2.5, 0, 0, Math.PI*2); ctx.fill();
      /* Hidung */
      ctx.fillStyle = '#FFD700';
      ctx.beginPath(); ctx.ellipse(cx, cy + s*0.15, 2, 1.5, 0, 0, Math.PI*2); ctx.fill();
      /* Kumis */
      ctx.strokeStyle = '#666'; ctx.lineWidth = 0.8;
      [-1,1].forEach(d => {
        ctx.beginPath(); ctx.moveTo(cx + d*s*0.15, cy + s*0.2);
        ctx.lineTo(cx + d*s*0.8, cy + s*0.05); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx + d*s*0.15, cy + s*0.3);
        ctx.lineTo(cx + d*s*0.8, cy + s*0.35); ctx.stroke();
      });
    };
    drawFace(28, 28, 16);
    drawFace(w-28, 28, 16);
    drawFace(28, h-28, 16);
    drawFace(w-28, h-28, 16);
    /* Bintang kecil */
    let sd = 500;
    const r = () => { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; };
    for (let i = 0; i < 8; i++) {
      drawStar(ctx, 20 + r()*(w-40), 50 + r()*(h-80), 4 + r()*4, '#FFD700');
    }
  }
};

/* =============================================
   KOMPOSISI PHOTOSTRIP
============================================= */
function composeStrip() {
  const dims = getStripDimensions(state.stripCount);
  const { width: W, height: H, photoSize: PS, padding: P, gap: G } = dims;
  previewCanvas.width = W;
  previewCanvas.height = H;

  /* Gambar frame background */
  drawFrame(previewCtx, state.frame, W, H, state.stripCount);

  /* Gambar setiap foto */
  state.photos.forEach((dataUrl, i) => {
    const img = new Image();
    img.src = dataUrl;
    const x = P;
    const y = P + i * (PS + G);
    previewCtx.save();
    roundRect(previewCtx, x, y, PS, PS, 8);
    previewCtx.clip();
    previewCtx.drawImage(img, x, y, PS, PS);
    previewCtx.restore();
    /* Border foto */
    previewCtx.strokeStyle = 'rgba(255,255,255,0.6)';
    previewCtx.lineWidth = 2;
    roundRect(previewCtx, x, y, PS, PS, 8);
    previewCtx.stroke();
  });

  /* Watermark */
  previewCtx.fillStyle = 'rgba(150,130,140,0.4)';
  previewCtx.font = '600 9px Quicksand, sans-serif';
  previewCtx.textAlign = 'center';
  previewCtx.fillText('mochi booth', W/2, H - 8);
}

/* =============================================
   STICKER SYSTEM (PREVIEW)
============================================= */
function loadStickers() {
  $('sticker-layer').innerHTML = '';
  state.stickers = [];
}

function addStickerToPreview(emoji) {
  const wrap = $('preview-strip-wrap');
  const rect = wrap.getBoundingClientRect();
  const canvasRect = previewCanvas.getBoundingClientRect();

  const el = document.createElement('div');
  el.className = 'placed-sticker';
  el.textContent = emoji;
  el.style.left = (canvasRect.left - rect.left + Math.random() * canvasRect.width * 0.6 + canvasRect.width * 0.2) + 'px';
  el.style.top = (canvasRect.top - rect.top + Math.random() * canvasRect.height * 0.6 + canvasRect.height * 0.1) + 'px';

  const delBtn = document.createElement('button');
  delBtn.className = 'del-btn';
  delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
  delBtn.addEventListener('click', (e) => { e.stopPropagation(); el.remove(); });
  el.appendChild(delBtn);

  /* Drag */
  let isDragging = false, startX, startY, origX, origY;
  const onDown = (e) => {
    isDragging = true;
    const pt = e.touches ? e.touches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    origX = parseInt(el.style.left); origY = parseInt(el.style.top);
    el.style.zIndex = 100;
    e.preventDefault();
  };
  const onMove = (e) => {
    if (!isDragging) return;
    const pt = e.touches ? e.touches[0] : e;
    el.style.left = (origX + pt.clientX - startX) + 'px';
    el.style.top = (origY + pt.clientY - startY) + 'px';
    e.preventDefault();
  };
  const onUp = () => { isDragging = false; el.style.zIndex = 1; };

  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove', onMove);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);

  $('sticker-layer').appendChild(el);
}

/* =============================================
   DOWNLOAD DENGAN STICKER
============================================= */
function downloadStrip() {
  /* Buat canvas final dengan sticker */
  const finalCanvas = document.createElement('canvas');
  finalCanvas.width = previewCanvas.width;
  finalCanvas.height = previewCanvas.height;
  const fCtx = finalCanvas.getContext('2d');
  fCtx.drawImage(previewCanvas, 0, 0);

  /* Render sticker ke canvas */
  const wrap = $('preview-strip-wrap');
  const canvasRect = previewCanvas.getBoundingClientRect();
  const scaleX = previewCanvas.width / canvasRect.width;
  const scaleY = previewCanvas.height / canvasRect.height;
  const offsetX = canvasRect.left - wrap.getBoundingClientRect().left;
  const offsetY = canvasRect.top - wrap.getBoundingClientRect().top;

  const stickers = $('sticker-layer').querySelectorAll('.placed-sticker');
  const promises = [];
  stickers.forEach(el => {
    const p = new Promise(resolve => {
      const emoji = el.textContent.replace(/\s/g, '').replace(/\u00D7/g, '');
      const x = (parseInt(el.style.left) - offsetX) * scaleX;
      const y = (parseInt(el.style.top) - offsetY) * scaleY;
      fCtx.font = `${36 * scaleX}px serif`;
      fCtx.textAlign = 'center';
      fCtx.textBaseline = 'middle';
      fCtx.fillText(emoji, x + 18*scaleX, y + 18*scaleY);
      resolve();
    });
    promises.push(p);
  });

  Promise.all(promises).then(() => {
    const link = document.createElement('a');
    link.download = `mochi-booth-${Date.now()}.png`;
    link.href = finalCanvas.toDataURL('image/png');
    link.click();
    showToast('Foto berhasil diunduh!');
    launchConfetti();
  });
}

/* =============================================

============================================= */
function saveToGallery() {
  const data = previewCanvas.toDataURL('image/jpeg', 0.7);
  state.gallery.unshift({ data, date: new Date().toISOString() });
  if (state.gallery.length > 20) state.gallery.pop();
  try { localStorage.setItem('mochi_gallery', JSON.stringify(state.gallery)); } catch(e) {}
  showToast('Disimpan ke gallery!');
}

function loadGallery() {
  try {
    const d = localStorage.getItem('mochi_gallery');
    if (d) state.gallery = JSON.parse(d);
  } catch(e) { state.gallery = []; }
}

function renderGallery() {
  const grid = $('gallery-grid');
  grid.innerHTML = '';
  if (state.gallery.length === 0) {
    grid.innerHTML = '<div class="gallery-empty"><i class="fa-solid fa-camera-retro"></i><p>Belum ada foto tersimpan</p></div>';
    return;
  }
  state.gallery.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.innerHTML = `<img src="${item.data}" alt="Foto ${i+1}" loading="lazy"><button class="gallery-del" aria-label="Hapus"><i class="fa-solid fa-xmark"></i></button>`;
    div.querySelector('img').addEventListener('click', () => {
      /* Tampilkan besar di preview */
      const img = new Image();
      img.onload = () => {
        previewCanvas.width = img.width;
        previewCanvas.height = img.height;
        previewCtx.drawImage(img, 0, 0);
        loadStickers();
        showScreen('preview');
      };
      img.src = item.data;
    });
    div.querySelector('.gallery-del').addEventListener('click', (e) => {
      e.stopPropagation();
      state.gallery.splice(i, 1);
      try { localStorage.setItem('mochi_gallery', JSON.stringify(state.gallery)); } catch(err) {}
      renderGallery();
    });
    grid.appendChild(div);
  });
}

function clearGallery() {
  if (state.gallery.length === 0) return;
  /* Modal konfirmasi */
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box"><h3>Hapus Semua Foto?</h3><p>Tindakan ini tidak bisa dibatalkan.</p><div class="modal-actions"><button class="btn btn-secondary btn-sm" id="modal-cancel">Batal</button><button class="btn btn-primary btn-sm" id="modal-confirm">Hapus</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#modal-cancel').onclick = () => overlay.remove();
  overlay.querySelector('#modal-confirm').onclick = () => {
    state.gallery = [];
    try { localStorage.removeItem('mochi_gallery'); } catch(e) {}
    renderGallery();
    overlay.remove();
    showToast('Gallery dikosongkan');
  };
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
}

/* =============================================
   KONFETI
============================================= */
function launchConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#F4A0B5','#C3B1E1','#FFCBA4','#B8E0D2','#FFD700','#FF8FAB','#FFB7C5'];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * 200,
      w: 6 + Math.random() * 6,
      h: 4 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 10,
      life: 1
    });
  }
  let frame = 0;
  function animate() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.08;
      p.rot += p.rotV;
      if (p.y > confettiCanvas.height + 20) { p.life = 0; return; }
      p.life -= 0.003;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot * Math.PI / 180);
      confettiCtx.globalAlpha = Math.max(0, p.life);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      confettiCtx.restore();
    });
    frame++;
    if (alive && frame < 300) requestAnimationFrame(animate);
    else confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  }
  animate();
}

/* =============================================
   INISIALISASI UI
============================================= */
function initUI() {
  /* Frame grid */
  const fg = $('frame-grid');
  fg.innerHTML = '';
  frameDefs.forEach(f => {
    const card = document.createElement('div');
    card.className = 'frame-card' + (f.id === state.frame ? ' selected' : '');
    card.dataset.id = f.id;
    card.innerHTML = `<div class="frame-preview" style="background:${f.bg};border:2px solid ${f.color};border-radius:inherit;inset:0;position:absolute;"></div><span class="frame-name">${f.name}</span>`;
    card.addEventListener('click', () => {
      state.frame = f.id;
      fg.querySelectorAll('.frame-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
    });
    fg.appendChild(card);
  });

  /* Filter grid */
  const flg = $('filter-grid');
  flg.innerHTML = '';
  filterDefs.forEach(f => {
    const card = document.createElement('div');
    card.className = 'filter-card' + (f.id === state.filter ? ' selected' : '');
    card.dataset.id = f.id;
    /* Preview kotak dengan warna gradient sebagai representasi filter */
    const previewColors = {
      none: 'linear-gradient(135deg,#FFB7C5,#C3B1E1)',
      softglow: 'linear-gradient(135deg,#FFD6E0,#E8DEFF)',
      vintage: 'linear-gradient(135deg,#D4A574,#C4A8B4)',
      pinktone: 'linear-gradient(135deg,#FF8FAB,#FFB7C5)',
      bw: 'linear-gradient(135deg,#888,#444)',
      dreamy: 'linear-gradient(135deg,#FFC8D6,#D8C0FF)'
    };
    card.innerHTML = `<div class="filter-preview" style="background:${previewColors[f.id] || previewColors.none}"></div><span>${f.name}</span>`;
    card.addEventListener('click', () => {
      state.filter = f.id;
      flg.querySelectorAll('.filter-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      applyFilter();
    });
    flg.appendChild(card);
  });

  /* Strip options */
  const so = $('strip-options');
  so.innerHTML = '';
  [2, 4, 6].forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (n === state.stripCount ? ' selected' : '');
    btn.textContent = n + ' Foto';
    btn.addEventListener('click', () => {
      state.stripCount = n;
      so.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      updateProgress();
    });
    so.appendChild(btn);
  });

  /* Countdown options */
  const co = $('countdown-options');
  co.innerHTML = '';
  [3, 5, 10].forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (n === state.countdown ? ' selected' : '');
    btn.textContent = n + ' detik';
    btn.addEventListener('click', () => {
      state.countdown = n;
      co.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    co.appendChild(btn);
  });

  /* Sticker grid */
  const sg = $('sticker-grid');
  sg.innerHTML = '';
  stickerDefs.forEach(s => {
    const item = document.createElement('div');
    item.className = 'sticker-item';
    item.textContent = s;
    item.addEventListener('click', () => {
      if (state.screen === 'preview') addStickerToPreview(s);
      else showToast('Tambahkan sticker setelah mengambil foto', 'error');
    });
    sg.appendChild(item);
  });

  updateProgress();
}

});

/* Panel handle mobile */
 $('panel-handle').addEventListener('click', () => {
  $('controls-panel').classList.toggle('collapsed');
});

/* Keyboard: Space untuk capture */
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && state.screen === 'booth' && !state.isCapturing) {
    e.preventDefault();
    startCapture();
  }
});

/* =============================================
   INISIALISASI
============================================= */
function init() {
  createFloatingElements();
  initUI();
  loadGallery();
  updateProgress();

  /* Sparkle interval */
  setInterval(spawnSparkle, 2000);

  /* Resize confetti canvas */
  window.addEventListener('resize', () => {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  });

  /* Cek tema tersimpan */
  const savedTheme = localStorage.getItem('mochi_theme');
  if (savedTheme) setTheme(savedTheme);
}

/* Simpan tema */
const origSetTheme = setTheme;
setTheme = function(theme) {
  origSetTheme(theme);
  try { localStorage.setItem('mochi_theme', theme); } catch(e) {}
};

init();
</script>
</body>
</html>
